version: 2

project_name: "Podsync"

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/podsync/
    binary: podsync
    flags:
      - -trimpath
    tags:
      - netgo
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.arch={{.Arch}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    ignore:
      - goos: windows
        goarch: arm

archives:
  - id: arc
    name_template: >-
      {{- .ProjectName }}_{{.Version}}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    files:
      - LICENSE*
      - README*
      - config.toml.example
      - html/**
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ .Tag }}-next'

changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - Merge pull request
    - Merge branch

release:
  github:
    owner: fqx
    name: podsync-with-yt-dlp
  prerelease: auto
  # Publishing this fork must not promote a beta over the existing stable release.
  make_latest: false
  header: |
    Podsync {{ .Version }} beta: episode artwork and automatic filename compatibility.

    ```toml
    [feeds.example.custom]
    episode_cover_art = "auto"
    ```

    Use a public image URL for fixed artwork, "auto" for YouTube square artwork,
    or omit the setting for original thumbnails. Auto mode fits the full thumbnail
    over a Gaussian-blurred background with a 15% black overlay; foreground brightness
    is unchanged. Existing episodes are supported with persistent caching and failure fallback.
    Generated artwork follows episode/media cleanup, with safe orphan reconciliation
    and retirement of older cache versions after replacement RSS is published.

    This release preserves leading/trailing hyphens and underscores in default ID
    filenames. Automatic compatibility recognizes the current filename template,
    original IDs, and beta.3 trimmed IDs. Local storage adds atomic hard links,
    retaining old URLs without copying video; S3 and unsupported hard links reuse
    existing media URLs. Ownership checks prevent ambiguous aliases and template
    collisions from overwriting or serving another episode's media. Cleanup handles
    all recognized paths while protecting retained episodes. GUIDs remain unchanged.
    RSS resolves media names before filling missing display dates.

    Automatic migration does not reconstruct arbitrary historical custom templates,
    old titles/dates or previous extensions. See README for supported cases; no
    manual migration command is needed.

    Extract the archive for your OS and CPU, then run `podsync --config config.toml`.
    The CLI needs ffmpeg and yt-dlp (set downloader.custom_binary if using that name).
    The container includes its runtime dependencies. See README for configuration,
    image limits and cache behavior. This beta does not update the stable latest image.
  footer: |
    ## Docker image (Linux amd64 and arm64)
    ```
    docker pull ghcr.io/fqx/podsync-with-yt-dlp:{{ .Tag }}
    ```
