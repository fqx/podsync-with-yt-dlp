name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      packages: write

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Make release binaries
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v2.14.0
          args: release --clean

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🧪 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔒 Log in to the Container registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose container tags
        id: image-tags
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          image_tags="${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}"
          if [[ "$RELEASE_TAG" != *-* ]]; then
            image_tags="${image_tags},${REGISTRY}/${IMAGE_NAME}:latest"
          fi
          echo "tags=$image_tags" >> "$GITHUB_OUTPUT"

      - name: 🏗️ Build container and push
        uses: docker/build-push-action@v7
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TAG=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.image-tags.outputs.tags }}
